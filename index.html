// ─── ATOMS ───────────────────────────────────────────────────────────────────
function Tag({s}) {
  const c = SC[s]||SC["En cours"];
  return <span style={{display:"inline-block",padding:"2px 8px",borderRadius:4,fontSize:"0.7rem",fontWeight:500,background:c.bg,color:c.tx}}>{s}</span>;
}
function Pts({n}) {
  const v = (n==null||n==="")?"—":n;
  const bg = (!v||v==="—")?"rgba(255,255,255,0.06)":v>=2?"rgba(224,92,92,0.25)":"rgba(240,180,41,0.2)";
  const cl = (!v||v==="—")?"#7a8299":v>=4?"#ff6b6b":v>=2?"#e05c5c":"#f0b429";
  return <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:22,height:22,borderRadius:"50%",fontFamily:"DM Mono,monospace",fontSize:"0.72rem",fontWeight:500,background:bg,color:cl}}>{v}</span>;
}
function Bar({label,pct,color,val}) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
      <div style={{fontSize:"0.78rem",color:"#7a8299",width:110,flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{label}</div>
      <div style={{flex:1,height:8,background:"#1c2030",borderRadius:4,overflow:"hidden"}}>
        <div style={{height:"100%",borderRadius:4,background:color,width:`${pct}%`,transition:"width 1.2s cubic-bezier(.16,1,.3,1)"}}/>
      </div>
      <div style={{fontFamily:"DM Mono,monospace",fontSize:"0.78rem",color:"#e8eaf0",width:60,textAlign:"right"}}>{val}</div>
    </div>
  );
}

// ─── MODAL ───────────────────────────────────────────────────────────────────
function ModalEdit({row,setRow,isAdd,onSave,onDelete,onClose}) {
  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20,backdropFilter:"blur(5px)"}}>
      <div style={{background:"#151820",border:"1px solid #252a3a",borderRadius:18,padding:28,width:"100%",maxWidth:600,maxHeight:"90vh",overflowY:"auto"}}>
        <h2 style={{fontFamily:"DM Serif Display,serif",fontSize:"1.35rem",marginBottom:20,color:"#e8eaf0"}}>
          {isAdd?"Nouvelle contravention":`Modifier — ${row.conducteur||"..."}`}
        </h2>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:13}}>
          {[
            {label:"Conducteur *",k:"conducteur",  t:"text",   ph:"NOM Prénom"},
            {label:"Véhicule",    k:"vehicule",    t:"text",   ph:"AB-123-CD"},
            {label:"Code parc",   k:"code_parc",   t:"text",   ph:"ex: 05001P"},
            {label:"Lieu",        k:"lieu",         t:"text"},
            {label:"Date",        k:"date",         t:"date"},
            {label:"Détail",      k:"detail",       t:"text",   ph:"ex: 85/80 km/h"},
            {label:"Points",      k:"points",       t:"number"},
            {label:"Coût (€)",    k:"cout",         t:"number"},
          ].map(f=>(
            <div key={f.k}>
              <label style={{display:"block",fontSize:"0.63rem",textTransform:"uppercase",letterSpacing:".08em",color:"#7a8299",marginBottom:5}}>{f.label}</label>
              <input style={FI} type={f.t} value={row[f.k]??""} placeholder={f.ph||""} min={f.t==="number"?0:undefined}
                onChange={e=>setRow(r=>({...r,[f.k]:f.t==="number"?Number(e.target.value):e.target.value}))}/>
            </div>
          ))}
          {[
            {label:"Agence",k:"agence",opts:AGENCES},
            {label:"Type",  k:"type",  opts:["Vitesse","Stationnement","Autre"]},
            {label:"Statut",k:"statut",opts:["En cours","Dénoncée","Payée","Contestée","Annulée"]},
          ].map(f=>(
            <div key={f.k}>
              <label style={{display:"block",fontSize:"0.63rem",textTransform:"uppercase",letterSpacing:".08em",color:"#7a8299",marginBottom:5}}>{f.label}</label>
              <select style={FI} value={row[f.k]} onChange={e=>setRow(r=>({...r,[f.k]:e.target.value}))}>
                {f.opts.map(o=><option key={o}>{o}</option>)}
              </select>
            </div>
          ))}
          <div style={{gridColumn:"span 2"}}>
            <label style={{display:"block",fontSize:"0.63rem",textTransform:"uppercase",letterSpacing:".08em",color:"#7a8299",marginBottom:5}}>Suivi / Info</label>
            <input style={FI} value={row.info||""} placeholder="DENONCE LE xx/xx, PAYEE LE..."
              onChange={e=>setRow(r=>({...r,info:e.target.value}))}/>
          </div>
          <div style={{gridColumn:"span 2"}}>
            <label style={{display:"block",fontSize:"0.63rem",textTransform:"uppercase",letterSpacing:".08em",color:"#7a8299",marginBottom:5}}>💬 Commentaire</label>
            <textarea style={{...FI,resize:"vertical",minHeight:60}} value={row.commentaire||""} placeholder="Note interne..."
              onChange={e=>setRow(r=>({...r,commentaire:e.target.value}))}/>
          </div>
          <div style={{gridColumn:"span 2",marginTop:4,paddingTop:16,borderTop:"1px solid #252a3a"}}>
            <div style={{fontSize:"0.63rem",textTransform:"uppercase",letterSpacing:".08em",color:"#7c6bff",marginBottom:8,fontWeight:600}}>📎 Pièces jointes — OneDrive</div>
            <div style={{fontSize:"0.72rem",color:"#7a8299",marginBottom:12,background:"rgba(124,107,255,.06)",border:"1px solid rgba(124,107,255,.15)",borderRadius:8,padding:"8px 12px"}}>
              💡 Dans OneDrive, fais clic droit sur le fichier → <strong style={{color:"#e8eaf0"}}>Partager</strong> → <strong style={{color:"#e8eaf0"}}>Copier le lien</strong>, puis colle-le ici.
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:13}}>
              <div>
                <label style={{display:"block",fontSize:"0.63rem",textTransform:"uppercase",letterSpacing:".08em",color:"#7a8299",marginBottom:5}}>🔴 Avis de contravention</label>

                {row.lien_pv&&(

                    style={{display:"inline-flex",alignItems:"center",gap:5,marginTop:7,padding:"4px 11px",borderRadius:6,border:"1px solid rgba(224,92,92,.3)",background:"rgba(224,92,92,.1)",color:"#e05c5c",fontSize:"0.72rem",textDecoration:"none",fontWeight:500}}>
                    ↗ Ouvrir l'avis PV

              </div>
              <div>
                <label style={{display:"block",fontSize:"0.63rem",textTransform:"uppercase",letterSpacing:".08em",color:"#7a8299",marginBottom:5}}>🔵 Document de dénonciation</label>
                <input style={FI} value={row.lien_denonciation||""} placeholder="https://onedrive.live.com/..."

                    ↗ Ouvrir la dénonciation
                  </a>
                )}
              </div>
            </div>
          </div>
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:20}}>
          {!isAdd&&<button onClick={onDelete} style={{marginRight:"auto",padding:"8px 16px",borderRadius:8,border:"1px solid rgba(224,92,92,.3)",background:"rgba(224,92,92,.1)",color:"#e05c5c",fontSize:"0.8rem"}}>🗑️ Supprimer</button>}
          <button onClick={onClose} style={{padding:"8px 16px",borderRadius:8,border:"1px solid #252a3a",background:"#1c2030",color:"#7a8299",fontSize:"0.8rem"}}>Annuler</button>

// ─── TABLE TAB ────────────────────────────────────────────────────────────────
function TableTab({search,setSearch,fAgence,setFAgence,fStatut,setFStatut,sortK,sortD,onSort,filtered,onEdit,onAdd}) {
  const cols="24px 1.5fr 1fr .8fr .8fr .8fr 1fr .6fr 68px 88px 28px 32px";
  const Th=({label,k})=>(
    <div onClick={()=>onSort(k)} style={{fontSize:"0.6rem",textTransform:"uppercase",letterSpacing:".1em",color:sortK===k?"#e8eaf0":"#7a8299",cursor:"pointer",userSelect:"none",display:"flex",alignItems:"center",gap:3,fontWeight:500}}>
      {label}{sortK===k?(sortD==="asc"?" ↑":" ↓"):""}
    </div>
  );
  return (
    <div>
      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{flex:1,minWidth:200,position:"relative",display:"flex",alignItems:"center"}}>
          <input style={{...FI,paddingRight:32}} placeholder="🔍  Rechercher conducteur, véhicule, lieu..."
            value={search} onChange={e=>setSearch(e.target.value)}/>
          {search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:8,background:"none",border:"none",color:"#7a8299",cursor:"pointer",fontSize:"1rem",lineHeight:1,padding:2}}>✕</button>}
        </div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
          {STATUTS.map(s=>(
            <button key={s} onClick={()=>setFStatut(s)}
              style={{padding:"7px 12px",borderRadius:7,border:`1px solid ${fStatut===s?"#7c6bff":"#252a3a"}`,background:fStatut===s?"rgba(124,107,255,.15)":"#151820",color:fStatut===s?"#7c6bff":"#7a8299",fontSize:"0.75rem"}}>
              {s}
            </button>
          ))}
        </div>
        <select style={{...FI,width:"auto"}} value={fAgence} onChange={e=>setFAgence(e.target.value)}>
          <option value="Toutes">Toutes agences</option>
          {AGENCES.map(a=><option key={a}>{a}</option>)}
        </select>
        {!READ_ONLY&&<button onClick={onAdd} style={{padding:"8px 16px",borderRadius:8,border:"1px solid rgba(61,214,140,.35)",background:"rgba(61,214,140,.12)",color:"#3dd68c",fontSize:"0.8rem",fontWeight:600,whiteSpace:"nowrap"}}>+ Ajouter</button>}
      </div>
      <div style={{background:"#151820",border:"1px solid #252a3a",borderRadius:14,overflow:"hidden"}}>
        <div style={{display:"grid",gridTemplateColumns:cols,padding:"9px 14px",borderBottom:"1px solid #252a3a"}}>
          <div style={{fontSize:"0.6rem",color:"#7a8299"}}>#</div>
          <Th label="Conducteur" k="conducteur"/><Th label="Véhicule" k="vehicule"/><Th label="Agence" k="agence"/>
          <Th label="Date" k="date"/>
          <div style={{fontSize:"0.6rem",textTransform:"uppercase",letterSpacing:".1em",color:"#7a8299",fontWeight:500}}>Lieu</div>
          <Th label="Infraction" k="detail"/><Th label="Pts" k="points"/><Th label="Coût" k="cout"/><Th label="Statut" k="statut"/>
          <div style={{fontSize:"0.6rem",textTransform:"uppercase",letterSpacing:".1em",color:"#7a8299",fontWeight:500}}>PJ</div>
          <div/>
        </div>
        {filtered.length===0
          ?<div style={{textAlign:"center",padding:40,color:"#7a8299",fontSize:"0.85rem"}}>Aucun résultat</div>
          :filtered.map((r,i)=>(
            <div key={r.id}
              style={{display:"grid",gridTemplateColumns:cols,padding:"9px 14px",borderBottom:"1px solid rgba(255,255,255,.03)",alignItems:"center",background:i%2===0?"transparent":"rgba(255,255,255,.01)",transition:"background .12s"}}
              onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.03)"}
              onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"transparent":"rgba(255,255,255,.01)"}>
              <div style={{fontSize:"0.62rem",color:"#3a3f52"}}>{i+1}</div>
              <div style={{fontSize:"0.78rem",fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",paddingRight:6}} title={r.conducteur}>{r.conducteur}</div>
              <div style={{fontSize:"0.72rem",fontFamily:"DM Mono,monospace",color:"#7a8299",paddingRight:6}}>
                <div style={{color: r.code_parc?"#e8eaf0":"#7a8299"}}>{r.code_parc||r.vehicule}</div>
                {r.code_parc&&<div style={{fontSize:"0.65rem",color:"#3a3f52",marginTop:1}}>{r.vehicule}</div>}
              </div>
              <div style={{fontSize:"0.73rem",color:"#7a8299",paddingRight:6}}>{r.agence}</div>
              <div style={{fontSize:"0.72rem",fontFamily:"DM Mono,monospace",color:"#7a8299",paddingRight:6}}>{fmtDate(r.date)}</div>
              <div style={{fontSize:"0.73rem",color:"#7a8299",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",paddingRight:6}}>{r.lieu||"—"}</div>
              <div style={{fontSize:"0.75rem",paddingRight:6}}>{r.detail}</div>
              <div style={{paddingRight:6}}><Pts n={r.points}/></div>
              <div style={{fontFamily:"DM Mono,monospace",fontSize:"0.8rem",color:["En cours","Contestée"].includes(r.statut)?"#f0b429":"#e8eaf0"}}>{r.cout?`${r.cout} €`:"—"}</div>
              <div><Tag s={r.statut}/></div>
              <div style={{display:"flex",gap:3,alignItems:"center"}}>
                {r.lien_pv&&<a href={r.lien_pv} target="_blank" rel="noreferrer" title="Avis de contravention" style={{textDecoration:"none",fontSize:"0.85rem",lineHeight:1}}>🔴</a>}
                {r.lien_denonciation&&<a href={r.lien_denonciation} target="_blank" rel="noreferrer" title="Document de dénonciation" style={{textDecoration:"none",fontSize:"0.85rem",lineHeight:1}}>🔵</a>}
              </div>
              <div>{!READ_ONLY&&<button onClick={()=>onEdit(r)} style={{background:"none",border:"none",color:"#7a8299",padding:3,fontSize:"0.85rem"}}>✏️</button>}</div>
            </div>
          ))
        }
        {filtered.length>0&&(
          <div style={{display:"flex",justifyContent:"flex-end",padding:"10px 14px",borderTop:"1px solid #252a3a",gap:20,fontSize:"0.75rem",color:"#7a8299"}}>
            <span>{filtered.length} ligne{filtered.length>1?"s":""}</span>
            <span style={{fontFamily:"DM Mono,monospace",color:"#e8eaf0",fontWeight:600}}>Total : {filtered.reduce((s,r)=>s+(r.cout||0),0).toFixed(2)} €</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({act,ann,kpi,onEdit}) {
  const {totalGeneral,chargeEntreprise,totalPaye,totalDenonce,totalPoints,totalAnnule,nbEnCours,nbDenonce,nbPayee,enCoursList,byAgence,maxAgCout,byCond,maxCdCout,nbVit,nbStat,coutVit,coutStat} = kpi;
  return (
    <div>
      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:16,marginBottom:32}}>
        {[
          {label:"Coût total",          val:`${totalGeneral.toFixed(0)} €`,     sub:`${act.length} infractions actives`, c:"#e05c5c"},
          {label:"À charge entreprise", val:`${chargeEntreprise.toFixed(0)} €`, sub:`${nbEnCours} en cours + contestée`, c:"#e05c5c"},
          {label:"Payé",                val:`${totalPaye.toFixed(0)} €`,         sub:`${nbPayee} contraventions soldées`, c:"#3dd68c"},
          {label:"Dénoncées",           val:`${totalDenonce.toFixed(0)} €`,      sub:`${nbDenonce} dossiers — hors charge`,c:"#f0b429"},
          {label:"Points perdus",       val:`${totalPoints} pts`,                sub:`Sur ${nbVit} infractions vitesse`,  c:"#4ecdc4"},
        ].map((k,i)=>(
          <div key={k.label} style={{background:"#151820",border:"1px solid #252a3a",borderTop:`3px solid ${k.c}`,borderRadius:16,padding:"24px 20px",animation:`fadeIn .6s ${i*.06+.05}s both`}}>
            <div style={{fontSize:"0.72rem",textTransform:"uppercase",letterSpacing:".1em",color:"#7a8299",marginBottom:10,fontWeight:500}}>{k.label}</div>
            <div style={{fontFamily:"DM Serif Display,serif",fontSize:"2.4rem",lineHeight:1,marginBottom:6,color:k.c}}>{k.val}</div>
            <div style={{fontSize:"0.78rem",color:"#7a8299"}}>{k.sub}</div>
          </div>
        ))}
      </div>

      {/* Alert */}
      <div style={{background:"rgba(224,92,92,.08)",border:"1px solid rgba(224,92,92,.25)",borderRadius:12,padding:"16px 20px",marginBottom:24,display:"flex",alignItems:"flex-start",gap:14,fontSize:"0.85rem",lineHeight:1.5}}>
        <span style={{fontSize:"1.1rem",flexShrink:0}}>⚠️</span>
        <div>
          <strong>Attention — RIORD ADRIEN</strong> cumule 4 infractions en moins d'une semaine (21-23 jan.) sur le même véhicule <span style={{color:"#f0b429",fontFamily:"DM Mono,monospace"}}>GX-024-XJ</span>, dont 2 à plus de 100 km/h. Total : <span style={{color:"#f0b429",fontFamily:"DM Mono,monospace"}}>270€ · −4 points</span>.<br/><br/>
          <strong>Charge réelle entreprise : {chargeEntreprise.toFixed(0)} €</strong> — les {totalDenonce.toFixed(0)} € dénoncés sont transférés aux conducteurs. <strong>DUBOS VINCENT</strong> (ESA) : 135€ en <strong>contestation</strong>.
        </div>
      </div>

      {/* En cours — remonté ici */}
      <div style={{background:"linear-gradient(135deg,#151820 0%,#1a1810 100%)",border:"1px solid rgba(240,180,41,.3)",borderRadius:16,padding:24,marginBottom:24}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22}}>
          <div style={{fontSize:"0.72rem",textTransform:"uppercase",letterSpacing:".1em",color:"#7a8299",fontWeight:500,display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:"#f0b429",display:"inline-block",animation:"pulse 1.5s infinite"}}/>
            🔥 Dossiers en cours — action requise
          </div>
          <span style={{fontSize:"0.78rem",color:"#f0b429",fontWeight:500}}>{enCoursList.length} dossiers · {chargeEntreprise.toFixed(0)} €</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14}}>
          {enCoursList.map(r=>{
            const isC=r.statut==="Contestée";
            return (
              <div key={r.id}
                onClick={()=>!READ_ONLY&&onEdit&&onEdit(r)}
                style={{background:isC?"linear-gradient(135deg,#1c2030,#1c1520)":"#1c2030",border:`1px solid ${isC?"rgba(224,92,92,.25)":"rgba(240,180,41,.15)"}`,borderRadius:12,padding:"16px 18px",position:"relative",overflow:"hidden",cursor:READ_ONLY?"default":"pointer",transition:"border-color .15s,transform .1s"}}
                onMouseEnter={e=>{if(!READ_ONLY){e.currentTarget.style.borderColor=isC?"rgba(224,92,92,.6)":"rgba(240,180,41,.5)";e.currentTarget.style.transform="translateY(-1px)";}}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor=isC?"rgba(224,92,92,.25)":"rgba(240,180,41,.15)";e.currentTarget.style.transform="translateY(0)";}}>
                <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:isC?"#e05c5c":"#f0b429",opacity:.6}}/>
                {!READ_ONLY&&<div style={{position:"absolute",top:10,right:10,fontSize:"0.65rem",color:"#3a3f52"}}>✏️</div>}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div>
                    <div style={{fontSize:"0.88rem",fontWeight:600}}>{r.conducteur}{isC&&<span style={{fontSize:"0.7rem",color:"#e05c5c",marginLeft:6}}>⚖️</span>}</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:5}}>
                      {[r.agence,r.vehicule,r.lieu].filter(Boolean).map(v=>(
                        <span key={v} style={{fontSize:"0.68rem",padding:"2px 8px",borderRadius:4,background:"rgba(255,255,255,.06)",color:"#7a8299",fontFamily:"DM Mono,monospace"}}>{v}</span>
                      ))}
                    </div>
                  </div>
                  <span style={{fontFamily:"DM Serif Display,serif",fontSize:"1.4rem",color:isC?"#e05c5c":"#f0b429",flexShrink:0,paddingLeft:8}}>{r.cout} €</span>
                </div>
                <div style={{fontSize:"0.72rem",color:"#7a8299",lineHeight:1.5,paddingTop:8,borderTop:"1px solid rgba(255,255,255,.05)"}}>
                  <strong style={{color:"#e8eaf0"}}>{r.detail}</strong>{r.date?` — ${fmtDate(r.date)}`:""}<br/>
                  {Number(r.points)>0&&<span style={{color:"#f0b429"}}>−{r.points} pt{r.points>1?"s":""} · </span>}
                  {r.info}
                  {r.commentaire&&<div style={{marginTop:4,color:"#7c6bff",fontSize:"0.7rem"}}>💬 {r.commentaire}</div>}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{marginTop:16,padding:"12px 16px",background:"rgba(240,180,41,.06)",borderRadius:8,border:"1px solid rgba(240,180,41,.1)",fontSize:"0.78rem",color:"#7a8299",display:"flex",gap:24,flexWrap:"wrap"}}>
          <span>💡 <strong style={{color:"#e8eaf0"}}>EMP : {enCoursList.filter(r=>r.agence==="EMP").length}/{enCoursList.length} dossiers</strong> ({enCoursList.filter(r=>r.agence==="EMP").reduce((s,r)=>s+(r.cout||0),0)} €)</span>
          {enCoursList.some(r=>!r.conducteur||r.conducteur==="EMP (véhicule)")&&<span>⚠️ <strong style={{color:"#e8eaf0"}}>Conducteur non identifié</strong> : {enCoursList.filter(r=>!r.conducteur||r.conducteur==="EMP (véhicule)").map(r=>r.vehicule).join(", ")}</span>}
          {enCoursList.length>0&&<span>📅 <strong style={{color:"#e8eaf0"}}>En attente</strong> : {enCoursList.map(r=>r.conducteur.split(" ")[0]).join(", ")}</span>}
        </div>
      </div>

      {/* Agences + Donut */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:20,marginBottom:24}}>
        <div style={{background:"#151820",border:"1px solid #252a3a",borderRadius:16,padding:24}}>
          <div style={{fontSize:"0.72rem",textTransform:"uppercase",letterSpacing:".1em",color:"#7a8299",marginBottom:20,fontWeight:500,display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:"#f0b429",display:"inline-block"}}/> Coût par agence
          </div>
          {byAgence.map(a=><Bar key={a.agence} label={a.agence} pct={(a.cout/maxAgCout)*100} color={a.cout>=500?"#e05c5c":"#7c6bff"} val={`${a.cout.toFixed(0)} €`}/>)}
          <div style={{fontSize:"0.7rem",color:"#7a8299",marginTop:10,paddingTop:10,borderTop:"1px solid #252a3a"}}>
            Total : {totalGeneral.toFixed(0)} € · annulées non comprises ({totalAnnule.toFixed(0)} €)
          </div>
        </div>
        <div style={{background:"#151820",border:"1px solid #252a3a",borderRadius:16,padding:24}}>
          <div style={{fontSize:"0.72rem",textTransform:"uppercase",letterSpacing:".1em",color:"#7a8299",marginBottom:20,fontWeight:500,display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:"#7c6bff",display:"inline-block"}}/> Infractions par agence
          </div>
          {byAgence.map(a=><Bar key={a.agence} label={a.agence} pct={(a.nb/act.length)*100} color={a.nb>=10?"#e05c5c":"#7c6bff"} val={`${a.nb} PV`}/>)}
          <div style={{fontSize:"0.7rem",color:"#7a8299",marginTop:10,paddingTop:10,borderTop:"1px solid #252a3a"}}>
            EMP = {act.filter(r=>r.agence==="EMP").length}/{act.length} ({((act.filter(r=>r.agence==="EMP").length/act.length)*100).toFixed(0)}%)
          </div>
        </div>
        <div style={{background:"#151820",border:"1px solid #252a3a",borderRadius:16,padding:24}}>
          <div style={{fontSize:"0.72rem",textTransform:"uppercase",letterSpacing:".1em",color:"#7a8299",marginBottom:20,fontWeight:500,display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:"#4ecdc4",display:"inline-block"}}/> Type d'infraction
          </div>
          <div style={{display:"flex",alignItems:"center",gap:20}}>
            <svg width="110" height="110" viewBox="0 0 110 110" style={{flexShrink:0}}>
              <circle cx="55" cy="55" r="38" fill="none" stroke="#1c2030" strokeWidth="14"/>
              <circle cx="55" cy="55" r="38" fill="none" stroke="#e05c5c" strokeWidth="14"
                strokeDasharray={`${(nbVit/act.length)*238.76} 238.76`} strokeDashoffset="59.69" strokeLinecap="round"
                style={{transformOrigin:"center",transform:"rotate(-90deg)"}}/>
              <circle cx="55" cy="55" r="38" fill="none" stroke="#4ecdc4" strokeWidth="14"
                strokeDasharray={`${(nbStat/act.length)*238.76} 238.76`} strokeDashoffset="0" strokeLinecap="round"
                style={{transformOrigin:"center",transform:`rotate(-90deg) rotate(${(nbVit/act.length)*360}deg)`}}/>
              <text x="55" y="51" textAnchor="middle" fontFamily="DM Serif Display,serif" fontSize="16" fill="#e8eaf0">{act.length}</text>
              <text x="55" y="64" textAnchor="middle" fontFamily="DM Sans,sans-serif" fontSize="8" fill="#7a8299">infractions</text>
            </svg>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {[
                {label:"Vitesse",       color:"#e05c5c",n:nbVit, cout:coutVit, pts:totalPoints},
                {label:"Stationnement", color:"#4ecdc4",n:nbStat,cout:coutStat,pts:0},
              ].map(t=>(
                <div key={t.label}>
                  <div style={{display:"flex",alignItems:"center",gap:8,fontSize:"0.82rem"}}>
                    <span style={{width:10,height:10,borderRadius:"50%",background:t.color,display:"inline-block"}}/>{t.label}
                  </div>
                  <div style={{fontFamily:"DM Mono,monospace",fontSize:"0.7rem",color:"#7a8299",marginTop:2}}>
                    {t.n} — {((t.n/act.length)*100).toFixed(0)}% · {t.cout.toFixed(0)} €{t.pts>0?` · ${t.pts} pts`:""}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Statuts + Conducteurs */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:20,marginBottom:24}}>
        <div style={{background:"#151820",border:"1px solid #252a3a",borderRadius:16,padding:24}}>
          <div style={{fontSize:"0.72rem",textTransform:"uppercase",letterSpacing:".1em",color:"#7a8299",marginBottom:20,fontWeight:500,display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:"#3dd68c",display:"inline-block"}}/> Statut des dossiers
          </div>
          {[
            {label:"Dénoncées",n:nbDenonce,                                   color:"#4ecdc4"},
            {label:"Payées",   n:nbPayee,                                      color:"#3dd68c"},
            {label:"En cours", n:act.filter(r=>r.statut==="En cours").length, color:"#f0b429"},
            {label:"Contestée",n:act.filter(r=>r.statut==="Contestée").length,color:"#e05c5c"},
          ].map(s=><Bar key={s.label} label={s.label} pct={(s.n/act.length)*100} color={s.color} val={`${s.n} / ${act.length}`}/>)}
          <div style={{marginTop:16,paddingTop:14,borderTop:"1px solid #252a3a",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:"0.65rem",textTransform:"uppercase",color:"#7a8299"}}>Total</span>
            <span style={{fontFamily:"DM Serif Display,serif",fontSize:"1.4rem"}}>{totalGeneral.toFixed(0)} €</span>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:10}}>
            {[
              {label:"Réglé/Dénoncé",   val:`${(totalPaye+totalDenonce).toFixed(0)} €`,sub:`${totalPaye.toFixed(0)} + ${totalDenonce.toFixed(0)}`,c:"#3dd68c",bg:"rgba(61,214,140,.08)",bc:"rgba(61,214,140,.2)"},
              {label:"Charge entreprise",val:`${chargeEntreprise.toFixed(0)} €`,       sub:`${nbEnCours} actifs`,                                   c:"#e05c5c",bg:"rgba(224,92,92,.08)",  bc:"rgba(224,92,92,.2)"},
            ].map(b=>(
              <div key={b.label} style={{background:b.bg,border:`1px solid ${b.bc}`,borderRadius:8,padding:"9px 10px",textAlign:"center"}}>
                <div style={{fontSize:"0.6rem",textTransform:"uppercase",color:b.c,marginBottom:3}}>{b.label}</div>
                <div style={{fontFamily:"DM Mono,monospace",fontSize:"0.95rem",color:b.c}}>{b.val}</div>
                <div style={{fontSize:"0.62rem",color:"#7a8299",marginTop:2}}>{b.sub}</div>
              </div>
            ))}
          </div>
        </div>
        <div style={{background:"#151820",border:"1px solid #252a3a",borderRadius:16,padding:24}}>
          <div style={{fontSize:"0.72rem",textTransform:"uppercase",letterSpacing:".1em",color:"#7a8299",marginBottom:20,fontWeight:500,display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:"#e05c5c",display:"inline-block"}}/> Conducteurs — coût & points
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 20px"}}>
            {byCond.map(c=>(
              <div key={c.conducteur} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                <div style={{fontSize:"0.75rem",color:"#7a8299",width:105,flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={c.conducteur}>
                  {c.conducteur.split(" ").map((w,i)=>i===0?w:w[0]+".").join(" ")}
                </div>
                <div style={{flex:1,height:7,background:"#1c2030",borderRadius:4,overflow:"hidden"}}>
                  <div style={{height:"100%",borderRadius:4,background:c.points>=2?"#e05c5c":"#7c6bff",width:`${(c.cout/maxCdCout)*100}%`,transition:"width 1.2s"}}/>
                </div>
                <div style={{fontFamily:"DM Mono,monospace",fontSize:"0.73rem",width:80,textAlign:"right",display:"flex",alignItems:"center",gap:5,justifyContent:"flex-end"}}>
                  <span>{c.cout.toFixed(0)} €</span><Pts n={c.points}/>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [tab,     setTab]     = useState("dashboard");
  const [rows,    setRows]    = useState(()=>{
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : DEFAULT_DATA;
    } catch(e) { return DEFAULT_DATA; }
  });
  const [search,  setSearch]  = useState("");
  const [fAgence, setFAgence] = useState("Toutes");
  const [fStatut, setFStatut] = useState("Tous");
  const [sortK,   setSortK]   = useState("id");
  const [sortD,   setSortD]   = useState("asc");
  const [modal,   setModal]   = useState(null);
  const [editRow, setEditRow] = useState(null);
  const [toast,   setToast]   = useState(null);

  // Sauvegarde automatique à chaque modification
  useEffect(()=>{
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rows)); } catch(e) {}
  }, [rows]);

  const showToast = m => { setToast(m); setTimeout(()=>setToast(null),2500); };

  const act = rows.filter(r=>r.statut!=="Annulée");
  const ann = rows.filter(r=>r.statut==="Annulée");

  const kpi = {
    totalGeneral:     act.reduce((s,r)=>s+(r.cout||0),0),
    chargeEntreprise: act.filter(r=>["En cours","Contestée"].includes(r.statut)).reduce((s,r)=>s+(r.cout||0),0),
    totalPaye:        act.filter(r=>r.statut==="Payée").reduce((s,r)=>s+(r.cout||0),0),
    totalDenonce:     act.filter(r=>r.statut==="Dénoncée").reduce((s,r)=>s+(r.cout||0),0),
    totalPoints:      act.reduce((s,r)=>s+(Number(r.points)||0),0),
    totalAnnule:      ann.reduce((s,r)=>s+(r.cout||0),0),
    nbEnCours:        act.filter(r=>["En cours","Contestée"].includes(r.statut)).length,
    nbDenonce:        act.filter(r=>r.statut==="Dénoncée").length,
    nbPayee:          act.filter(r=>r.statut==="Payée").length,
    enCoursList:      act.filter(r=>["En cours","Contestée"].includes(r.statut)),
    byAgence:         AGENCES.map(a=>({agence:a,cout:act.filter(r=>r.agence===a).reduce((s,r)=>s+(r.cout||0),0),nb:act.filter(r=>r.agence===a).length})).filter(a=>a.nb>0).sort((a,b)=>b.cout-a.cout),
    byCond:           Object.values(act.reduce((acc,r)=>{if(!acc[r.conducteur])acc[r.conducteur]={conducteur:r.conducteur,cout:0,points:0};acc[r.conducteur].cout+=r.cout||0;acc[r.conducteur].points+=Number(r.points)||0;return acc;},{})).sort((a,b)=>b.cout-a.cout).slice(0,7),
    nbVit:  act.filter(r=>r.type==="Vitesse").length,
    nbStat: act.filter(r=>r.type==="Stationnement").length,
    coutVit:  act.filter(r=>r.type==="Vitesse").reduce((s,r)=>s+(r.cout||0),0),
    coutStat: act.filter(r=>r.type==="Stationnement").reduce((s,r)=>s+(r.cout||0),0),
  };
  kpi.maxAgCout = kpi.byAgence[0]?.cout||1;
  kpi.maxCdCout = kpi.byCond[0]?.cout||1;

  const onSort = k=>{ setSortK(k); setSortD(d=>sortK===k?(d==="asc"?"desc":"asc"):"asc"); };
  const filtered = rows.filter(r=>{
    const q=search.toLowerCase();
    return (!search||[r.conducteur,r.vehicule,r.code_parc,r.lieu,r.agence,r.detail,r.info,r.commentaire].some(v=>v?.toLowerCase().includes(q)))
      &&(fAgence==="Toutes"||r.agence===fAgence)
      &&(fStatut==="Tous"||r.statut===fStatut);
  }).sort((a,b)=>{
    let va=a[sortK]??"",vb=b[sortK]??"";
    if(["cout","points","id"].includes(sortK)){va=Number(va);vb=Number(vb);}
    else{va=String(va).toLowerCase();vb=String(vb).toLowerCase();}
    return(va<vb?-1:va>vb?1:0)*(sortD==="asc"?1:-1);
  });

  const onEdit  = row=>{ setEditRow({...row}); setModal("edit"); };
  const onAdd   = ()=>{ setEditRow({id:Date.now(),conducteur:"",vehicule:"",agence:"EMP",lieu:"",date:"",type:"Vitesse",detail:"",points:0,cout:0,statut:"En cours",info:"",commentaire:"",lien_pv:"",lien_denonciation:""}); setModal("add"); };
  const onClose = ()=>{ setModal(null); setEditRow(null); };
  const onSave  = ()=>{
    if(!editRow.conducteur?.trim()){showToast("⚠️ Conducteur requis");return;}
    if(modal==="add"){setRows(r=>[...r,editRow]);showToast("✅ Ajoutée");}
    else{setRows(r=>r.map(x=>x.id===editRow.id?editRow:x));showToast("✅ Enregistré");}
    onClose();
  };
  const onDelete = ()=>{ setRows(r=>r.filter(x=>x.id!==editRow.id)); showToast("🗑️ Supprimé"); onClose(); };

  const exportHTML = () => {
    const originalHTML = document.documentElement.outerHTML;
    const dataStr = JSON.stringify(rows, null, 2)
      .replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
    const now = new Date();
    const dateStr = `${String(now.getDate()).padStart(2,'0')}-${String(now.getMonth()+1).padStart(2,'0')}-${now.getFullYear()}`;
    let newHTML = originalHTML
      // Injecte les données actuelles
      .replace(/const DEFAULT_DATA = \[[\s\S]*?\];/, `const DEFAULT_DATA = ${dataStr};`)
      // Passe en mode lecture seule
      .replace('const READ_ONLY = false;', 'const READ_ONLY = true;')
      // Met à jour la date dans le sous-titre
      .replace('💾 Sauvegarde automatique', `📅 Export du ${dateStr}`);
    const b64 = btoa(unescape(encodeURIComponent(newHTML)));
    const a = document.createElement('a');
    a.href = 'data:text/html;base64,' + b64;
    a.download = `contraventions_2026_export_${dateStr}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('📤 Fichier exporté en lecture seule !');
  };

  const exportExcel = () => {
    const now = new Date();
    const nowStr = `${String(now.getDate()).padStart(2,'0')}-${String(now.getMonth()+1).padStart(2,'0')}-${now.getFullYear()}`;
    const nowFr  = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;

    // ── Styles de base ────────────────────────────────────────────────────
    const thin = {style:"thin", color:{rgb:"BFBFBF"}};
    const borderAll  = {top:thin, bottom:thin, left:thin, right:thin};
    const fontNormal = {name:"Calibri", sz:11};
    const fontBold   = {name:"Calibri", sz:11, bold:true};
    const fillWhite  = {fgColor:{rgb:"FFFFFF"}};
    const fillHeader = {fgColor:{rgb:"D9E1F2"}}; // bleu pâle comme Excel par défaut
    const fillAlt    = {fgColor:{rgb:"F2F2F2"}}; // gris très léger lignes paires
    const fillTotal  = {fgColor:{rgb:"FFF2CC"}}; // jaune pâle pour totaux
    const centerAlign = {horizontal:"center", vertical:"center"};
    const leftAlign   = {horizontal:"left",   vertical:"center"};
    const rightAlign  = {horizontal:"right",  vertical:"center"};

    const styleCell = (ws, addr, {font, fill, alignment, numFmt}={}) => {
      if(!ws[addr]) ws[addr] = {v:"", t:"s"};
      ws[addr].s = { font:font||fontNormal, fill:fill||fillWhite, alignment:alignment||leftAlign, border:borderAll };
      if(numFmt) ws[addr].z = numFmt;
    };

    const act = rows.filter(r=>r.statut!=="Annulée");
    const ann = rows.filter(r=>r.statut==="Annulée");

    // ══════════════════════════════════════════════════════════════════════
    // ONGLET 1 — TCD CONTRAVENTION (tableau principal, trié par conducteur)
    // ══════════════════════════════════════════════════════════════════════
    const tcdCols = ["CONDUCTEUR","VEHICULE","AGENCE","DATE","POINTS","COMMENTAIRE","COUT","LIEU","STATUT","INFO"];
    const tcdData = [...act].sort((a,b)=>a.conducteur.localeCompare(b.conducteur)).map(r=>[
      r.conducteur.toUpperCase(),
      r.vehicule,
      r.agence,
      r.date || "",
      Number(r.points)||0,
      r.detail.toUpperCase(),
      Number(r.cout)||0,
      r.lieu.toUpperCase(),
      r.statut.toUpperCase(),
      r.info,
    ]);

    const wsTCD = XLSX.utils.aoa_to_sheet([
      [`SUIVI CONTRAVENTIONS FLOTTE 2026 — Export du ${nowFr}`],
      [],
      [],
      tcdCols,
      ...tcdData,
    ]);
    wsTCD['!cols'] = [{wch:22},{wch:13},{wch:13},{wch:12},{wch:7},{wch:28},{wch:9},{wch:22},{wch:13},{wch:40}];
    wsTCD['!rows'] = [{hpt:18},{hpt:8},{hpt:8},{hpt:16},...tcdData.map(()=>({hpt:15}))];
    // Titre ligne 1
    wsTCD['A1'].s = {font:{name:"Calibri",sz:13,bold:true}, fill:fillWhite, alignment:leftAlign};
    // En-têtes ligne 4
    tcdCols.forEach((_,ci)=>{
      const addr = XLSX.utils.encode_cell({r:3,c:ci});
      wsTCD[addr].s = {font:fontBold, fill:fillHeader, alignment:centerAlign, border:borderAll};
    });
    // Données
    tcdData.forEach((row,ri)=>{
      const fill = ri%2===0 ? fillWhite : fillAlt;
      tcdCols.forEach((_,ci)=>{
        const addr = XLSX.utils.encode_cell({r:ri+4,c:ci});
        if(!wsTCD[addr]) wsTCD[addr]={v:"",t:"s"};
        const isDate = ci===3;
        const isNum  = ci===4||ci===6;
        wsTCD[addr].s = {
          font: fontNormal,
          fill,
          alignment: isNum ? rightAlign : isDate ? centerAlign : leftAlign,
          border: borderAll,
        };
        // Format date dd/mm/yyyy
        if(isDate && row[ci]) {
          const parts = String(row[ci]).split("-");
          if(parts.length===3) { wsTCD[addr].v = `${parts[2]}/${parts[1]}/${parts[0]}`; wsTCD[addr].t="s"; }
        }
        // Format coût avec € 
        if(ci===6) { wsTCD[addr].z = '#,##0.00 "€"'; }
      });
    });
    // Ligne TOTAL
    const totalRow = tcdData.length+4;
    const totalData = ["TOTAL","","","","",`${act.length} infractions`,act.reduce((s,r)=>s+(r.cout||0),0),"","",""];
    XLSX.utils.sheet_add_aoa(wsTCD, [totalData], {origin:`A${totalRow+1}`});
    tcdCols.forEach((_,ci)=>{
      const addr = XLSX.utils.encode_cell({r:totalRow,c:ci});
      if(!wsTCD[addr]) wsTCD[addr]={v:"",t:"s"};
      wsTCD[addr].s = {font:fontBold, fill:fillTotal, alignment:ci===6?rightAlign:leftAlign, border:borderAll};
      if(ci===6) wsTCD[addr].z = '#,##0.00 "€"';
    });
    wsTCD['!freeze'] = {xSplit:0, ySplit:4};

    // ══════════════════════════════════════════════════════════════════════
    // ONGLET 2 — DONNEES (données brutes complètes)
    // ══════════════════════════════════════════════════════════════════════
    const donCols = ["CONDUCTEUR","VEHICULE","DATE","POINTS","COUT","COMMENTAIRE","LIEU","AGENCE","INFO","STATUT","LIEN PV","LIEN DENONCIATION"];
    const donData = rows.filter(r=>r.statut!=="Annulée").map(r=>[
      r.conducteur.toUpperCase(),
      r.vehicule,
      r.date ? (() => { const p=r.date.split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:""; })() : "",
      Number(r.points)||0,
      Number(r.cout)||0,
      r.detail.toUpperCase(),
      r.lieu.toUpperCase(),
      r.agence,
      r.info,
      r.statut.toUpperCase(),
      r.lien_pv||"",
      r.lien_denonciation||"",
    ]);
    const wsDON = XLSX.utils.aoa_to_sheet([donCols, ...donData]);
    wsDON['!cols'] = [{wch:22},{wch:13},{wch:12},{wch:7},{wch:9},{wch:28},{wch:22},{wch:13},{wch:40},{wch:13},{wch:35},{wch:35}];
    wsDON['!rows'] = [{hpt:16},...donData.map(()=>({hpt:15}))];
    donCols.forEach((_,ci)=>{
      const addr = XLSX.utils.encode_cell({r:0,c:ci});
      wsDON[addr].s = {font:fontBold, fill:fillHeader, alignment:centerAlign, border:borderAll};
    });
    donData.forEach((row,ri)=>{
      const fill = ri%2===0 ? fillWhite : fillAlt;
      donCols.forEach((_,ci)=>{
        const addr = XLSX.utils.encode_cell({r:ri+1,c:ci});
        if(!wsDON[addr]) wsDON[addr]={v:"",t:"s"};
        const isNum = ci===3||ci===4;
        wsDON[addr].s = {font:fontNormal, fill, alignment:isNum?rightAlign:ci===2?centerAlign:leftAlign, border:borderAll};
        if(ci===4) wsDON[addr].z = '#,##0.00 "€"';
      });
    });
    wsDON['!freeze'] = {xSplit:0, ySplit:1};

    // ══════════════════════════════════════════════════════════════════════
    // ONGLET 3 — ANNULES
    // ══════════════════════════════════════════════════════════════════════
    const annCols = ["CONDUCTEUR","VEHICULE","DATE","COUT","COMMENTAIRE","LIEU","AGENCE","INFO"];
    const annData = ann.map(r=>[
      r.conducteur.toUpperCase(),
      r.vehicule,
      r.date ? (() => { const p=r.date.split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:""; })() : "",
      Number(r.cout)||0,
      r.detail.toUpperCase(),
      r.lieu.toUpperCase(),
      r.agence,
      r.info,
    ]);
    const fillAnnule = {fgColor:{rgb:"E2EFDA"}}; // vert pâle pour annulées
    const wsANN = XLSX.utils.aoa_to_sheet([
      [`CONTRAVENTIONS ANNULÉES — Économie totale : ${ann.reduce((s,r)=>s+(r.cout||0),0).toFixed(2)} €`],
      [],
      annCols,
      ...annData
    ]);
    wsANN['!cols'] = [{wch:22},{wch:13},{wch:12},{wch:9},{wch:28},{wch:22},{wch:13},{wch:40}];
    wsANN['A1'].s = {font:{name:"Calibri",sz:12,bold:true,color:{rgb:"375623"}}, fill:fillAnnule, alignment:leftAlign};
    annCols.forEach((_,ci)=>{
      const addr = XLSX.utils.encode_cell({r:2,c:ci});
      if(wsANN[addr]) wsANN[addr].s = {font:fontBold, fill:{fgColor:{rgb:"A9D18E"}}, alignment:centerAlign, border:borderAll};
    });
    annData.forEach((row,ri)=>{
      annCols.forEach((_,ci)=>{
        const addr = XLSX.utils.encode_cell({r:ri+3,c:ci});
        if(!wsANN[addr]) wsANN[addr]={v:"",t:"s"};
        wsANN[addr].s = {font:fontNormal, fill:ri%2===0?fillWhite:{fgColor:{rgb:"F0F7EC"}}, alignment:ci===3?rightAlign:leftAlign, border:borderAll};
        if(ci===3) wsANN[addr].z = '#,##0.00 "€"';
      });
    });

    // ══════════════════════════════════════════════════════════════════════
    // ONGLET 4 — NBRE INFRA AGENCES
    // ══════════════════════════════════════════════════════════════════════
    const agences = ["AQUALIS","CA BASSIN","CA CANA","CMR BARON","EMP","ESA","SST","CA RESO"];
    const infraAgData = agences.map(a=>({ a, nb:act.filter(r=>r.agence===a).length })).filter(x=>x.nb>0).sort((a,b)=>b.nb-a.nb);
    const wsNIA = XLSX.utils.aoa_to_sheet([
      ["NOMBRE D'INFRACTIONS PAR AGENCE"],
      [],
      ["AGENCES","TOTAL"],
      ...infraAgData.map(x=>[x.a, x.nb]),
      ["TOTAL", infraAgData.reduce((s,x)=>s+x.nb,0)],
    ]);
    wsNIA['!cols'] = [{wch:16},{wch:10}];
    wsNIA['A1'].s = {font:{name:"Calibri",sz:12,bold:true}, fill:fillWhite, alignment:leftAlign};
    ["A3","B3"].forEach(addr=>{ if(wsNIA[addr]) wsNIA[addr].s={font:fontBold,fill:fillHeader,alignment:centerAlign,border:borderAll}; });
    infraAgData.forEach((_,ri)=>{
      ["A","B"].forEach((col,ci)=>{
        const addr=`${col}${ri+4}`;
        if(!wsNIA[addr]) wsNIA[addr]={v:"",t:"s"};
        wsNIA[addr].s={font:fontNormal,fill:ri%2===0?fillWhite:fillAlt,alignment:ci===0?leftAlign:rightAlign,border:borderAll};
      });
    });
    const totRowNIA = infraAgData.length+4;
    ["A","B"].forEach((col,ci)=>{
      const addr=`${col}${totRowNIA}`;
      if(!wsNIA[addr]) wsNIA[addr]={v:"",t:"s"};
      wsNIA[addr].s={font:fontBold,fill:fillTotal,alignment:ci===0?leftAlign:rightAlign,border:borderAll};
    });

    // ══════════════════════════════════════════════════════════════════════
    // ONGLET 5 — COUT AGENCES
    // ══════════════════════════════════════════════════════════════════════
    const coutAgData = agences.map(a=>({ a, cout:act.filter(r=>r.agence===a).reduce((s,r)=>s+(r.cout||0),0) })).filter(x=>x.cout>0).sort((a,b)=>b.cout-a.cout);
    const wsCA = XLSX.utils.aoa_to_sheet([
      ["COÛT PAR AGENCE"],
      [],
      ["AGENCE","SOMME DU COÛT"],
      ...coutAgData.map(x=>[x.a, x.cout]),
      ["TOTAL", coutAgData.reduce((s,x)=>s+x.cout,0)],
    ]);
    wsCA['!cols'] = [{wch:16},{wch:16}];
    wsCA['A1'].s = {font:{name:"Calibri",sz:12,bold:true}, fill:fillWhite, alignment:leftAlign};
    ["A3","B3"].forEach(addr=>{ if(wsCA[addr]) wsCA[addr].s={font:fontBold,fill:fillHeader,alignment:centerAlign,border:borderAll}; });
    coutAgData.forEach((_,ri)=>{
      ["A","B"].forEach((col,ci)=>{
        const addr=`${col}${ri+4}`;
        if(!wsCA[addr]) wsCA[addr]={v:"",t:"s"};
        wsCA[addr].s={font:fontNormal,fill:ri%2===0?fillWhite:fillAlt,alignment:ci===0?leftAlign:rightAlign,border:borderAll};
        if(ci===1) wsCA[addr].z='#,##0.00 "€"';
      });
    });
    const totRowCA = coutAgData.length+4;
    ["A","B"].forEach((col,ci)=>{
      const addr=`${col}${totRowCA}`;
      if(!wsCA[addr]) wsCA[addr]={v:"",t:"s"};
      wsCA[addr].s={font:fontBold,fill:fillTotal,alignment:ci===0?leftAlign:rightAlign,border:borderAll};
      if(ci===1) wsCA[addr].z='#,##0.00 "€"';
    });

    // ══════════════════════════════════════════════════════════════════════
    // ONGLET 6 — POINTS AGENCE
    // ══════════════════════════════════════════════════════════════════════
    const ptsAgData = agences.map(a=>({ a, pts:act.filter(r=>r.agence===a).reduce((s,r)=>s+(Number(r.points)||0),0) })).filter(x=>x.pts>0).sort((a,b)=>b.pts-a.pts);
    const wsPA = XLSX.utils.aoa_to_sheet([
      ["POINTS PERDUS PAR AGENCE"],
      [],
      ["AGENCE","SOMME DES POINTS"],
      ...ptsAgData.map(x=>[x.a, x.pts]),
      ["TOTAL", ptsAgData.reduce((s,x)=>s+x.pts,0)],
    ]);
    wsPA['!cols'] = [{wch:16},{wch:18}];
    wsPA['A1'].s = {font:{name:"Calibri",sz:12,bold:true}, fill:fillWhite, alignment:leftAlign};
    ["A3","B3"].forEach(addr=>{ if(wsPA[addr]) wsPA[addr].s={font:fontBold,fill:fillHeader,alignment:centerAlign,border:borderAll}; });
    ptsAgData.forEach((_,ri)=>{
      ["A","B"].forEach((col,ci)=>{
        const addr=`${col}${ri+4}`;
        if(!wsPA[addr]) wsPA[addr]={v:"",t:"s"};
        wsPA[addr].s={font:fontNormal,fill:ri%2===0?fillWhite:fillAlt,alignment:ci===0?leftAlign:rightAlign,border:borderAll};
      });
    });
    const totRowPA = ptsAgData.length+4;
    ["A","B"].forEach((col,ci)=>{
      const addr=`${col}${totRowPA}`;
      if(!wsPA[addr]) wsPA[addr]={v:"",t:"s"};
      wsPA[addr].s={font:fontBold,fill:fillTotal,alignment:ci===0?leftAlign:rightAlign,border:borderAll};
    });

    // ══════════════════════════════════════════════════════════════════════
    // ONGLET 7 — NBRE INFRA CONDUCTEUR
    // ══════════════════════════════════════════════════════════════════════
    const condMap = {};
    act.forEach(r=>{ condMap[r.conducteur]=(condMap[r.conducteur]||0)+1; });
    const condData = Object.entries(condMap).sort((a,b)=>b[1]-a[1]);
    const wsNIC = XLSX.utils.aoa_to_sheet([
      ["NOMBRE D'INFRACTIONS PAR CONDUCTEUR"],
      [],
      ["CONDUCTEUR","TOTAL"],
      ...condData.map(([c,n])=>[c.toUpperCase(), n]),
      ["TOTAL", condData.reduce((s,[,n])=>s+n,0)],
    ]);
    wsNIC['!cols'] = [{wch:26},{wch:10}];
    wsNIC['A1'].s = {font:{name:"Calibri",sz:12,bold:true}, fill:fillWhite, alignment:leftAlign};
    ["A3","B3"].forEach(addr=>{ if(wsNIC[addr]) wsNIC[addr].s={font:fontBold,fill:fillHeader,alignment:centerAlign,border:borderAll}; });
    condData.forEach((_,ri)=>{
      ["A","B"].forEach((col,ci)=>{
        const addr=`${col}${ri+4}`;
        if(!wsNIC[addr]) wsNIC[addr]={v:"",t:"s"};
        wsNIC[addr].s={font:fontNormal,fill:ri%2===0?fillWhite:fillAlt,alignment:ci===0?leftAlign:rightAlign,border:borderAll};
      });
    });
    const totRowNIC = condData.length+4;
    ["A","B"].forEach((col,ci)=>{
      const addr=`${col}${totRowNIC}`;
      if(!wsNIC[addr]) wsNIC[addr]={v:"",t:"s"};
      wsNIC[addr].s={font:fontBold,fill:fillTotal,alignment:ci===0?leftAlign:rightAlign,border:borderAll};
    });

    // ── Assemblage ────────────────────────────────────────────────────────
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsTCD, "TCD CONTRAVENTION");
    XLSX.utils.book_append_sheet(wb, wsDON, "DONNEES");
    XLSX.utils.book_append_sheet(wb, wsANN, "ANNULES");
    XLSX.utils.book_append_sheet(wb, wsNIA, "NBRE INFRA AGENCES");
    XLSX.utils.book_append_sheet(wb, wsCA,  "COUT AGENCES");
    XLSX.utils.book_append_sheet(wb, wsPA,  "POINTS AGENCE");
    XLSX.utils.book_append_sheet(wb, wsNIC, "NBRE INFRA CONDUC");

    XLSX.writeFile(wb, `SUIVI_CONTRAVENTIONS_2026_${nowStr}.xlsx`);
    showToast('📊 Export Excel généré !');
  };

  return (
    <div style={{minHeight:"100vh",background:"#0d0f14",color:"#e8eaf0",fontFamily:"DM Sans,sans-serif",padding:32,backgroundImage:"radial-gradient(ellipse at 20% 0%,rgba(124,107,255,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(240,180,41,.05) 0%,transparent 60%)"}}>

      {/* Header */}
      <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:36,paddingBottom:28,borderBottom:"1px solid #252a3a",flexWrap:"wrap",gap:12}}>
        <div>
          <h1 style={{fontFamily:"DM Serif Display,serif",fontSize:"2.8rem",lineHeight:1.1,letterSpacing:"-.02em"}}>
            Suivi <span style={{color:"#f0b429",fontStyle:"italic"}}>Contraventions</span><br/>Flotte 2026
          </h1>
          <p style={{color:"#7a8299",fontSize:"0.9rem",marginTop:6,fontWeight:300}}>Rapport d'analyse — données au 4 mars 2026 · 💾 Sauvegarde automatique</p>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          {tab==="table"&&!READ_ONLY&&<button onClick={onAdd} style={{padding:"9px 18px",borderRadius:9,border:"1px solid rgba(61,214,140,.35)",background:"rgba(61,214,140,.12)",color:"#3dd68c",fontSize:"0.82rem",fontWeight:600}}>+ Ajouter</button>}
          {!READ_ONLY&&<button onClick={exportExcel} style={{padding:"9px 18px",borderRadius:9,border:"1px solid rgba(61,214,140,.35)",background:"rgba(61,214,140,.12)",color:"#3dd68c",fontSize:"0.82rem",fontWeight:600}}>📊 Excel</button>}
          {READ_ONLY&&<span style={{padding:"6px 14px",borderRadius:999,background:"rgba(240,180,41,.1)",border:"1px solid rgba(240,180,41,.25)",color:"#f0b429",fontSize:"0.75rem",fontWeight:500}}>👁 Lecture seule</span>}
          <div style={{background:"#1c2030",border:"1px solid #252a3a",padding:"8px 16px",borderRadius:999,fontFamily:"DM Mono,monospace",fontSize:"0.8rem",color:"#7a8299"}}>
            {act.length} actives · {ann.length} annulées
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",gap:4,background:"#151820",borderRadius:12,padding:4,border:"1px solid #252a3a",marginBottom:28,width:"fit-content"}}>
        {[["dashboard","📊 Dashboard"],["table","📋 Tableau interactif"]].map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)}
            style={{padding:"9px 24px",borderRadius:9,fontSize:"0.82rem",fontWeight:500,border:"none",background:tab===k?"rgba(124,107,255,.2)":"transparent",color:tab===k?"#7c6bff":"#7a8299"}}>
            {l}
          </button>
        ))}
      </div>

      {tab==="dashboard"
        ?<Dashboard act={act} ann={ann} kpi={kpi} onEdit={onEdit}/>
        :<TableTab search={search} setSearch={setSearch} fAgence={fAgence} setFAgence={setFAgence} fStatut={fStatut} setFStatut={setFStatut} sortK={sortK} sortD={sortD} onSort={onSort} filtered={filtered} onEdit={onEdit} onAdd={onAdd}/>
      }

      {modal&&editRow&&<ModalEdit row={editRow} setRow={setEditRow} isAdd={modal==="add"} onSave={onSave} onDelete={onDelete} onClose={onClose}/>}
      {toast&&<div style={{position:"fixed",bottom:22,right:22,background:"#1c2030",border:"1px solid #252a3a",borderRadius:10,padding:"11px 18px",fontSize:"0.82rem",color:"#e8eaf0",zIndex:300,animation:"slideUp .3s ease",boxShadow:"0 8px 24px rgba(0,0,0,.4)"}}>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
